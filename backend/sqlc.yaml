version: "2"
sql:
  - schema: "migrations"
    queries: "internal/repository/queries"
    engine: "postgresql"
    gen:
      go:
        package: "repository"
        out: "internal/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "geography"
            go_type: "string"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
