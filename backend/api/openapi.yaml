openapi: 3.0.3
info:
  title: Fikir Dating App API - Authentication, Profiles & Media
  version: 1.1.0
  description: |
    Production-ready backend API for Fikir dating app in Ethiopia.
    Provides phone-based OTP authentication (Ethio Telecom and Safaricom Ethiopia),
    EdDSA JWT access tokens, rotating refresh tokens with reuse detection,
    profile management with Ethiopian region/city localization,
    and direct-to-storage media pipeline with libvips image compression.

servers:
  - url: http://localhost/api
    description: Local Docker Nginx Reverse Proxy
  - url: http://localhost:8080
    description: Direct Go API Service

paths:
  /v1/auth/otp/request:
    post:
      summary: Request phone OTP verification code
      description: |
        Normalizes Ethiopian phone number (Ethio Telecom 09... and Safaricom 07...),
        applies rate limits (60s cooldown, daily caps per phone and per IP),
        and dispatches a 6-digit verification code via SMS.
      parameters:
        - name: X-Device-Fingerprint
          in: header
          required: false
          schema:
            type: string
          description: Client device fingerprint for fraud and abuse tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOTPRequest'
      responses:
        '200':
          description: OTP dispatched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestOTPResponse'
        '400':
          description: Invalid phone number or non-mobile number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited due to 60s cooldown or daily quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/otp/verify:
    post:
      summary: Verify OTP code and obtain token pair
      description: |
        Verifies the 6-digit code using constant-time comparison (maximum 5 attempts).
        On success, provisions new user account or logs in existing user, registers FCM device,
        and returns an EdDSA access token and rotating refresh token.
      parameters:
        - name: X-Device-Fingerprint
          in: header
          required: false
          schema:
            type: string
          description: Client device fingerprint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
      responses:
        '200':
          description: Verification successful, token pair returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOTPResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Incorrect verification code or OTP expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Maximum verification attempts exceeded or account suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue new token pair
      description: |
        Exchanges a valid refresh token for a new EdDSA access token and rotated refresh token.
        Implements strict reuse detection: if an old/revoked refresh token is replayed,
        the entire session family is revoked immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Missing refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid, expired, or reused refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/logout:
    post:
      summary: Invalidate user session
      description: Revokes the refresh token and terminates active session.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /v1/me:
    delete:
      summary: Schedule account for soft deletion
      description: |
        Flags the account as deleted with a 30-day grace period (`deleted_at = NOW()`),
        revoking all active refresh tokens. Background workers permanently purge accounts
        older than 30 days.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Account soft-deleted and scheduled for purge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/me/profile:
    get:
      summary: Get authenticated user profile
      description: Fetches full dating profile including photos with CDN URLs and completeness score.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update profile attributes
      description: |
        Updates profile fields, validates age >= 18 from birthdate,
        resolves Ethiopian region from city, and updates completeness score.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: Underage or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/me/interests:
    put:
      summary: Update user interests
      description: Sets the list of interests tags for the user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInterestsRequest'
      responses:
        '200':
          description: Interests updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInterestsResponse'

  /v1/me/location:
    put:
      summary: Update location and coordinates
      description: Updates user geolocation coordinates (PostGIS) and resolves Ethiopian region.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
      responses:
        '200':
          description: Location updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'

  /v1/me/photos/upload-url:
    post:
      summary: Request presigned direct upload URL
      description: Generates a presigned PUT URL for private original storage (limit 8MB, max 6 photos).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadURLRequest'
      responses:
        '200':
          description: Presigned upload URL created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadURLResponse'
        '400':
          description: Disallowed format, size limit exceeded, or maximum 6 photos reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/me/photos/{id}/complete:
    post:
      summary: Signal photo upload completion
      description: Triggers async worker image processing pipeline (WebP/AVIF generation, BlurHash, EXIF removal).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Image processing task queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteUploadResponse'

  /v1/me/photos/{id}:
    delete:
      summary: Delete profile photo
      description: Deletes photo, cleans up storage, and automatically reorders remaining photos.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Photo deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /v1/me/photos/reorder:
    put:
      summary: Reorder profile photos
      description: Updates position order for user's photos (positions 1..N).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderPhotosRequest'
      responses:
        '200':
          description: Photos reordered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReorderPhotosResponse'

  /v1/me/verification:
    post:
      summary: Submit pose-based selfie verification
      description: Submits a selfie photo URL and pose for manual admin verification review.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '201':
          description: Verification submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA-signed JSON Web Token

  schemas:
    RequestOTPRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          example: '0911223344'
          description: Ethiopian phone number (accepts 09..., 9..., +2519..., 07..., 7...)

    RequestOTPResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        message:
          type: string
          example: Verification code sent
        cooldown_seconds:
          type: integer
          example: 60

    DevicePayload:
      type: object
      required:
        - fcm_token
        - platform
      properties:
        fcm_token:
          type: string
          example: 'dG9rZW4...sample-fcm'
        platform:
          type: string
          enum: [ios, android, web]
          example: android

    VerifyOTPRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
          example: '0911223344'
        code:
          type: string
          example: '123456'
        device:
          $ref: '#/components/schemas/DevicePayload'

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        phone_e164:
          type: string
          example: '+251911223344'
        status:
          type: string
          example: active
        locale:
          type: string
          example: am
        is_new_user:
          type: boolean
          example: true

    VerifyOTPResponse:
      type: object
      properties:
        access_token:
          type: string
          example: 'eyJhbGciOiJFZERTQSI...'
        refresh_token:
          type: string
          example: '4f6a1e...'
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
        user:
          $ref: '#/components/schemas/UserSummary'

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: '4f6a1e...'

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string

    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        message:
          type: string

    ProfileResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
          example: 'Sara Bekele'
        birthdate:
          type: string
          example: '1998-05-14'
        gender:
          type: string
          example: 'female'
        interested_in:
          type: array
          items:
            type: string
        bio:
          type: string
          example: 'Coffee lover in Addis Ababa'
        job_title:
          type: string
          example: 'Software Engineer'
        education:
          type: string
          example: 'Addis Ababa University'
        height_cm:
          type: integer
          example: 168
        religion:
          type: string
          example: 'Orthodox'
        languages:
          type: array
          items:
            type: string
        city:
          type: string
          example: 'Bole'
        region:
          type: string
          example: 'Addis Ababa'
        location:
          $ref: '#/components/schemas/Coordinates'
        show_me:
          type: boolean
          example: true
        distance_pref_km:
          type: integer
          example: 30
        age_min:
          type: integer
          example: 22
        age_max:
          type: integer
          example: 35
        verified:
          type: boolean
          example: false
        completeness_score:
          type: integer
          example: 85
        interests:
          type: array
          items:
            type: string
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PhotoObject'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      properties:
        display_name:
          type: string
        birthdate:
          type: string
          description: 'Format YYYY-MM-DD (must be at least 18 years old)'
        gender:
          type: string
        interested_in:
          type: array
          items:
            type: string
        bio:
          type: string
        job_title:
          type: string
        education:
          type: string
        height_cm:
          type: integer
        religion:
          type: string
        languages:
          type: array
          items:
            type: string
        city:
          type: string
        show_me:
          type: boolean
        distance_pref_km:
          type: integer
        age_min:
          type: integer
        age_max:
          type: integer

    Coordinates:
      type: object
      properties:
        latitude:
          type: number
          example: 9.0107
        longitude:
          type: number
          example: 38.7612

    UpdateLocationRequest:
      type: object
      required:
        - latitude
        - longitude
        - city
      properties:
        latitude:
          type: number
          example: 9.0107
        longitude:
          type: number
          example: 38.7612
        city:
          type: string
          example: 'Bole'

    UpdateInterestsRequest:
      type: object
      required:
        - interests
      properties:
        interests:
          type: array
          items:
            type: string

    UpdateInterestsResponse:
      type: object
      properties:
        interests:
          type: array
          items:
            type: string

    UploadURLRequest:
      type: object
      required:
        - content_type
        - file_size
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/heic, image/webp]
          example: image/jpeg
        file_size:
          type: integer
          example: 2450000

    UploadURLResponse:
      type: object
      properties:
        photo_id:
          type: string
          format: uuid
        upload_url:
          type: string
          example: 'http://minio:9000/fikir-media-original/originals/...'
        expires_in:
          type: integer
          example: 900

    CompleteUploadResponse:
      type: object
      properties:
        message:
          type: string
          example: 'image processing enqueued'
        photo_id:
          type: string
          format: uuid

    ReorderPhotosRequest:
      type: object
      required:
        - photo_ids
      properties:
        photo_ids:
          type: array
          items:
            type: string
            format: uuid

    ReorderPhotosResponse:
      type: object
      properties:
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PhotoObject'

    PhotoVariantDetail:
      type: object
      properties:
        url:
          type: string
        width:
          type: integer
        height:
          type: integer
        size:
          type: integer

    PhotoObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          example: 1
        status:
          type: string
          enum: [pending, approved, rejected]
        blurhash:
          type: string
          example: 'LEHLh[WB2yk8pyo0adRj00WYcg4q'
        dominant_color:
          type: string
          example: '#3b5f88'
        width:
          type: integer
          example: 1080
        height:
          type: integer
          example: 1350
        url:
          type: string
          example: 'http://localhost/media/photos/uid/hash/card.webp'
        variants:
          type: object
          description: Hierarchical variants (thumb, card, full) with format options
        created_at:
          type: string
          format: date-time

    VerificationRequest:
      type: object
      required:
        - photo_url
        - pose
      properties:
        photo_url:
          type: string
          example: 'http://localhost/media/photos/uid/hash/full.webp'
        pose:
          type: string
          example: 'turn_head_left'

    VerificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        photo_url:
          type: string
        pose:
          type: string
        status:
          type: string
          example: 'pending'
        created_at:
          type: string
          format: date-time

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        issue:
          type: string

    ErrorBody:
      type: object
      properties:
        code:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: Validation error
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
