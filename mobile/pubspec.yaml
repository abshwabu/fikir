name: fikir
description: "Fikir - Dating App for Ethiopia"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4

  # Models & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  uuid: ^4.5.1

  # Offline Cache & Storage
  drift: ^2.24.2
  drift_flutter: ^0.2.4
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  # Images & UI
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_blurhash: ^0.8.2
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  flutter_image_compress: ^2.5.1
  sms_autofill: ^2.5.0
  permission_handler: ^13.0.2
  mocktail: ^1.0.5

  path: any
  path_provider: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  drift_dev: ^2.24.2
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121212"
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    color_dark: "#121212"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/

  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
        - asset: assets/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700
