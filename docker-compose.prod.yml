services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M

  redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  minio:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  api:
    restart: always
    environment:
      APP_ENV: production
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  worker:
    restart: always
    environment:
      APP_ENV: production
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certs_data:/etc/letsencrypt
      - certbot_challenge:/var/www/certbot
      - nginx_cache:/var/cache/nginx
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 64M

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - certs_data:/etc/letsencrypt
      - certbot_challenge:/var/www/certbot
    entrypoint: >
      /bin/sh -c "
      trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot;
        sleep 12h & wait $${!};
      done;
      "

volumes:
  certs_data:
  certbot_challenge:
