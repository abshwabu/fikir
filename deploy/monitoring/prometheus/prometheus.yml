global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "fikir-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: "fikir-api"
          env: "production"

  - job_name: "fikir-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["worker:8080"]
        labels:
          service: "fikir-worker"
          env: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
