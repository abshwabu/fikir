# Production Nginx Configuration (TLS / Let's Encrypt / Certbot ready)

upstream api_upstream {
    server api:8080;
    keepalive 32;
}

upstream minio_upstream {
    server minio:9000;
    keepalive 32;
}

# HTTP: Redirect all traffic to HTTPS and handle ACME challenge
server {
    listen 80;
    server_name ${DOMAIN:-fikir.app} ${API_DOMAIN:-api.fikir.app};

    # Let's Encrypt / ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Secure proxy for API, WebSockets, and cached media
server {
    listen 443 ssl http2;
    server_name ${DOMAIN:-fikir.app} ${API_DOMAIN:-api.fikir.app};

    # TLS Certificates (Mount from Let's Encrypt / Certbot volume)
    ssl_certificate /etc/letsencrypt/live/${DOMAIN:-fikir.app}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN:-fikir.app}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # WebSocket endpoint
    location /ws {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API reverse proxy
    location /api {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Media reverse proxy to MinIO public bucket with caching
    location /media/ {
        proxy_pass http://minio_upstream/fikir-media-public/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_cache media_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 304 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_revalidate on;

        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    location = /healthz {
        proxy_pass http://api_upstream/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
