name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - "docker-compose*"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - "docker-compose*"
      - ".github/workflows/backend.yml"

jobs:
  lint-and-test:
    name: Lint, Test & Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.60
          working-directory: backend
          args: --timeout=5m

      - name: Run Backend Tests
        working-directory: backend
        run: go test -v -race ./...

      - name: Vulnerability Scanning (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./...

  build-and-push:
    name: Build & Push Images
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./deploy/docker/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/fikir-api:latest
            ghcr.io/${{ github.repository }}/fikir-api:${{ github.sha }}

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./deploy/docker/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/fikir-worker:latest
            ghcr.io/${{ github.repository }}/fikir-worker:${{ github.sha }}
